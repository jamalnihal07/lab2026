<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoPro - Your Ride, Your Way!</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .back-to-landing {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255, 107, 107, 0.9);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        
        .back-to-landing:hover {
            background: rgba(255, 107, 107, 1);
            transform: translateX(-5px);
        }
    </style>
</head>
<body>
    <a href="landing.html" class="back-to-landing">← Back to Landing</a>
    <div class="container">
        <!-- Login/Registration Modal -->
        <div class="auth-container" id="authContainer">
            <div class="auth-card">
                <div class="auth-header">
                    <h1 class="app-title">🚗 GoPro</h1>
                    <p class="app-tagline">Your Ride, Your Way!</p>
                </div>

                <!-- Login Form -->
                <div class="auth-form active" id="loginForm">
                    <h2>Login</h2>
                    <form onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label for="loginEmail">Email</label>
                            <input type="email" id="loginEmail" placeholder="Enter your email" required>
                        </div>
                        <div class="form-group">
                            <label for="loginPassword">Password</label>
                            <input type="password" id="loginPassword" placeholder="Enter your password" required>
                        </div>
                        <div class="form-group">
                            <label for="userType">Login As</label>
                            <select id="userType">
                                <option value="rider">Rider</option>
                                <option value="driver">Driver</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Login</button>
                    </form>
                    <p class="toggle-text">Don't have an account? <a href="#" onclick="toggleForms()">Sign Up</a></p>
                </div>

                <!-- Registration Form -->
                <div class="auth-form" id="signupForm">
                    <h2>Create Account</h2>
                    <form onsubmit="handleSignup(event)">
                        <div class="form-group">
                            <label for="signupName">Full Name</label>
                            <input type="text" id="signupName" placeholder="Enter your name" required>
                        </div>
                        <div class="form-group">
                            <label for="signupEmail">Email</label>
                            <input type="email" id="signupEmail" placeholder="Enter your email" required>
                        </div>
                        <div class="form-group">
                            <label for="signupPhone">Phone Number</label>
                            <input type="tel" id="signupPhone" placeholder="Enter your phone" required>
                        </div>
                        <div class="form-group">
                            <label for="signupPassword">Password</label>
                            <input type="password" id="signupPassword" placeholder="Create a password" required>
                        </div>
                        <div class="form-group">
                            <label for="signupConfirmPassword">Confirm Password</label>
                            <input type="password" id="signupConfirmPassword" placeholder="Confirm password" required>
                        </div>
                        <div class="form-group">
                            <label for="signupAccountType">Account Type</label>
                            <select id="signupAccountType">
                                <option value="rider">Rider</option>
                                <option value="driver">Driver</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Sign Up</button>
                    </form>
                    <p class="toggle-text">Already have an account? <a href="#" onclick="toggleForms()">Login</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
