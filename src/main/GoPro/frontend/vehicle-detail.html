<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoPro - Vehicle Details</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .detail-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 20px 40px;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 30px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #FF6B6B, #FF8E72);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(255, 107, 107, 0.3);
        }

        .vehicle-header {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
            margin-bottom: 50px;
        }

        .vehicle-image {
            font-size: 200px;
            text-align: center;
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.1), rgba(78, 205, 196, 0.1));
            padding: 60px;
            border-radius: 12px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .vehicle-info h1 {
            font-size: 48px;
            margin-bottom: 15px;
            color: #1a1a1a;
        }

        .vehicle-info p {
            font-size: 18px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .price-tag {
            display: inline-block;
            background: #FF6B6B;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .specs-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .spec-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #FF6B6B;
        }

        .spec-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
        }

        .spec-value {
            font-size: 20px;
            font-weight: bold;
            color: #1a1a1a;
            margin-top: 5px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-book, .btn-compare {
            flex: 1;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-book {
            background: linear-gradient(135deg, #FF6B6B, #FF8E72);
            color: white;
        }

        .btn-book:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(255, 107, 107, 0.3);
        }

        .btn-compare {
            background: white;
            color: #FF6B6B;
            border: 2px solid #FF6B6B;
        }

        .btn-compare:hover {
            background: #FF6B6B;
            color: white;
        }

        .features-section {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.1), rgba(78, 205, 196, 0.1));
            padding: 40px;
            border-radius: 12px;
            margin: 40px 0;
        }

        .features-section h2 {
            margin-bottom: 25px;
            color: #1a1a1a;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .feature-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .feature-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .feature-card h4 {
            margin: 10px 0;
            color: #1a1a1a;
        }

        .comparison-section {
            margin: 40px 0;
        }

        .comparison-section h2 {
            margin-bottom: 20px;
            color: #1a1a1a;
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        .comparison-table th {
            background: #FF6B6B;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: bold;
        }

        .comparison-table td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .comparison-table tr:hover {
            background: #f8f9fa;
        }

        .best-for {
            background: linear-gradient(135deg, #4ECDC4, #44A8A0);
            color: white;
            padding: 40px;
            border-radius: 12px;
            margin: 40px 0;
            text-align: center;
        }

        .best-for h3 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .best-for p {
            font-size: 18px;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .vehicle-header {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .vehicle-image {
                font-size: 120px;
                padding: 40px;
            }

            .vehicle-info h1 {
                font-size: 36px;
            }

            .specs-grid {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">🚗 GoPro</div>
            <div class="nav-links">
                <a href="landing.html" class="back-button">← Back to Landing</a>
            </div>
        </div>
    </nav>

    <div class="detail-container" id="vehicleContainer">
        <!-- Content will be populated by JavaScript -->
    </div>

    <script>
        const vehicles = {
            'bike': {
                icon: '🏍️',
                name: 'Bike',
                price: 5,
                capacity: 1,
                description: 'The fastest way to get around the city. Perfect for solo commuters and those who love the open road.',
                specs: [
                    { label: 'Price', value: 'Rs. 5/km' },
                    { label: 'Capacity', value: '1 Passenger' },
                    { label: 'Avg Speed', value: '40 km/h' },
                    { label: 'Best Time', value: '5-20 mins' }
                ],
                features: [
                    { icon: '⚡', name: 'Fastest Option' },
                    { icon: '💰', name: 'Most Affordable' },
                    { icon: '🎯', name: 'Traffic Friendly' },
                    { icon: '🌍', name: 'Eco-Friendly' }
                ],
                bestFor: 'Solo travelers, students, and office commuters looking for quick and affordable rides through traffic.',
                comparison: [
                    ['Feature', 'Bike', 'Auto', 'Mini', 'Sedan', 'SUV'],
                    ['Price', '★★★★★', '★★★★☆', '★★★☆☆', '★★☆☆☆', '★☆☆☆☆'],
                    ['Capacity', '1', '3', '4', '5', '7'],
                    ['Comfort', '★☆☆☆☆', '★★★☆☆', '★★★★☆', '★★★★★', '★★★★★'],
                    ['Speed', '★★★★★', '★★★☆☆', '★★★☆☆', '★★★☆☆', '★★☆☆☆']
                ]
            },
            'auto': {
                icon: '🔶',
                name: 'Auto',
                price: 8,
                capacity: 3,
                description: 'The iconic three-wheeler. Budget-friendly for small groups and daily commutes with classic Indian style.',
                specs: [
                    { label: 'Price', value: 'Rs. 8/km' },
                    { label: 'Capacity', value: '3 Passengers' },
                    { label: 'Avg Speed', value: '35 km/h' },
                    { label: 'Best Time', value: '10-25 mins' }
                ],
                features: [
                    { icon: '👥', name: 'Fits 3 People' },
                    { icon: '💰', name: 'Budget Friendly' },
                    { icon: '🛣️', name: 'Great for Lanes' },
                    { icon: '🇮🇳', name: 'Classic Indian' }
                ],
                bestFor: 'Small groups, short commutes, and local travel. Perfect for friends sharing a ride together.',
                comparison: [
                    ['Feature', 'Bike', 'Auto', 'Mini', 'Sedan', 'SUV'],
                    ['Price', '★★★★★', '★★★★☆', '★★★☆☆', '★★☆☆☆', '★☆☆☆☆'],
                    ['Capacity', '1', '3', '4', '5', '7'],
                    ['Comfort', '★☆☆☆☆', '★★★☆☆', '★★★★☆', '★★★★★', '★★★★★'],
                    ['Speed', '★★★★★', '★★★☆☆', '★★★☆☆', '★★★☆☆', '★★☆☆☆']
                ]
            },
            'mini': {
                icon: '🚗',
                name: 'Mini',
                price: 10,
                capacity: 4,
                description: 'The Goldilocks option. Just right comfort and price for most riders. Our most popular choice.',
                specs: [
                    { label: 'Price', value: 'Rs. 10/km' },
                    { label: 'Capacity', value: '4 Passengers' },
                    { label: 'Avg Speed', value: '50 km/h' },
                    { label: 'Best Time', value: '8-20 mins' }
                ],
                features: [
                    { icon: '😊', name: 'Perfect Balance' },
                    { icon: '👥', name: 'Fits 4 People' },
                    { icon: '🛣️', name: 'Hatchback Style' },
                    { icon: '🌟', name: 'Most Popular' }
                ],
                bestFor: 'Families, small groups, and everyday travel. The best choice for most riders seeking comfort and value.',
                comparison: [
                    ['Feature', 'Bike', 'Auto', 'Mini', 'Sedan', 'SUV'],
                    ['Price', '★★★★★', '★★★★☆', '★★★☆☆', '★★☆☆☆', '★☆☆☆☆'],
                    ['Capacity', '1', '3', '4', '5', '7'],
                    ['Comfort', '★☆☆☆☆', '★★★☆☆', '★★★★☆', '★★★★★', '★★★★★'],
                    ['Speed', '★★★★★', '★★★☆☆', '★★★☆☆', '★★★☆☆', '★★☆☆☆']
                ]
            },
            'sedan': {
                icon: '🚙',
                name: 'Sedan',
                price: 12,
                capacity: 5,
                description: 'Premium comfort for business travel. Spacious, quiet, and professional. Make the right impression.',
                specs: [
                    { label: 'Price', value: 'Rs. 12/km' },
                    { label: 'Capacity', value: '5 Passengers' },
                    { label: 'Avg Speed', value: '55 km/h' },
                    { label: 'Best Time', value: '7-18 mins' }
                ],
                features: [
                    { icon: '💼', name: 'Business Ready' },
                    { icon: '🔇', name: 'Quiet Ride' },
                    { icon: '👔', name: 'Professional' },
                    { icon: '⭐', name: 'Premium Feel' }
                ],
                bestFor: 'Business meetings, airport transfers, and corporate events. When first impression matters.',
                comparison: [
                    ['Feature', 'Bike', 'Auto', 'Mini', 'Sedan', 'SUV'],
                    ['Price', '★★★★★', '★★★★☆', '★★★☆☆', '★★☆☆☆', '★☆☆☆☆'],
                    ['Capacity', '1', '3', '4', '5', '7'],
                    ['Comfort', '★☆☆☆☆', '★★★☆☆', '★★★★☆', '★★★★★', '★★★★★'],
                    ['Speed', '★★★★★', '★★★☆☆', '★★★☆☆', '★★★☆☆', '★★☆☆☆']
                ]
            },
            'suv': {
                icon: '🚐',
                name: 'SUV',
                price: 15,
                capacity: 7,
                description: 'The ultimate luxury experience. Spacious, comfortable, and impressive. Go big for special occasions.',
                specs: [
                    { label: 'Price', value: 'Rs. 15/km' },
                    { label: 'Capacity', value: '7 Passengers' },
                    { label: 'Avg Speed', value: '45 km/h' },
                    { label: 'Best Time', value: '10-25 mins' }
                ],
                features: [
                    { icon: '👑', name: 'Luxury Ride' },
                    { icon: '👥', name: 'Fits 7 People' },
                    { icon: '🎉', name: 'Perfect for Groups' },
                    { icon: '🏆', name: 'VIP Treatment' }
                ],
                bestFor: 'Large groups, family outings, celebrations, and when you want to travel in style and comfort.',
                comparison: [
                    ['Feature', 'Bike', 'Auto', 'Mini', 'Sedan', 'SUV'],
                    ['Price', '★★★★★', '★★★★☆', '★★★☆☆', '★★☆☆☆', '★☆☆☆☆'],
                    ['Capacity', '1', '3', '4', '5', '7'],
                    ['Comfort', '★☆☆☆☆', '★★★☆☆', '★★★★☆', '★★★★★', '★★★★★'],
                    ['Speed', '★★★★★', '★★★☆☆', '★★★☆☆', '★★★☆☆', '★★☆☆☆']
                ]
            }
        };

        function getVehicleKey() {
            const params = new URLSearchParams(window.location.search);
            return params.get('type') || 'mini';
        }

        function renderVehicle() {
            const key = getVehicleKey();
            const vehicle = vehicles[key];

            if (!vehicle) {
                document.getElementById('vehicleContainer').innerHTML = '<p>Vehicle not found</p>';
                return;
            }

            let html = `
                <div class="vehicle-header">
                    <div class="vehicle-image">${vehicle.icon}</div>
                    <div class="vehicle-info">
                        <h1>${vehicle.name}</h1>
                        <p>${vehicle.description}</p>
                        <div class="price-tag">Rs. ${vehicle.price}/km</div>
                        
                        <div class="specs-grid">
                            ${vehicle.specs.map(s => `
                                <div class="spec-item">
                                    <div class="spec-label">${s.label}</div>
                                    <div class="spec-value">${s.value}</div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="action-buttons">
                            <button class="btn-book" onclick="window.location.href='index.html'">Book Now</button>
                            <button class="btn-compare" onclick="showComparison()">Compare All</button>
                        </div>
                    </div>
                </div>

                <div class="features-section">
                    <h2>Why Choose ${vehicle.name}?</h2>
                    <div class="features-grid">
                        ${vehicle.features.map(f => `
                            <div class="feature-card">
                                <div class="feature-icon">${f.icon}</div>
                                <h4>${f.name}</h4>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="best-for">
                    <h3>Perfect For</h3>
                    <p>${vehicle.bestFor}</p>
                </div>

                <div class="comparison-section">
                    <h2>How It Compares</h2>
                    <table class="comparison-table">
                        ${vehicle.comparison.map((row, idx) => {
                            if (idx === 0) {
                                return `<thead><tr>${row.map(cell => `<th>${cell}</th>`).join('')}</tr></thead>`;
                            }
                            return `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`;
                        }).join('')}
                    </table>
                </div>
            `;

            document.getElementById('vehicleContainer').innerHTML = html;
        }

        function showComparison() {
            alert('All vehicles displayed above for comparison. Choose the one that fits your needs best!');
        }

        // Render vehicle on page load
        renderVehicle();
    </script>
</body>
</html>
